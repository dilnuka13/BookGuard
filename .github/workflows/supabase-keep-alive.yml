name: Supabase Free-Tier Keep-Alive Ping

on:
  schedule:
    # Runs every 3 days at 00:00 UTC (Resets Supabase 7-day inactivity pause counter)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    name: Send Keep-Alive Signal to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API & Inactivity Reset
        run: |
          echo "Sending keep-alive ping to Supabase..."
          SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://kktssqxwzmyrifmjgmko.supabase.co' }}"
          ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtrdHNzcXh3em15cmlmbWpnbWtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3OTc2NTUsImV4cCI6MjEwNTM3MzY1NX0.1agYAwaoQdJdheekgO1leHNpAVavCsPC8ikpuscRsns' }}"

          HTTP_RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json")

          echo "HTTP Response Status: $HTTP_RESPONSE"
          cat response.json
          echo ""

          if [ "$HTTP_RESPONSE" -ge 200 ] && [ "$HTTP_RESPONSE" -lt 300 ]; then
            echo "✅ Supabase keep-alive signal successfully received. Inactivity timer reset for 7 days."
          else
            echo "⚠️ Warning: Response code was $HTTP_RESPONSE. Check credentials if request failed."
          fi
